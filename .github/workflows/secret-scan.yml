name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Recherche de secrets (tout l'historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 \
            git /repo --redact=100 --exit-code=1
      - name: Scan sans dépendance
        run: python3 scripts/secret_scan.py --all
